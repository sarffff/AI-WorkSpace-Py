name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: 后端测试 (pytest)
    runs-on: ubuntu-latest
    env:
      # config.py 在导入期就校验 JWT 密钥不是默认占位符,CI 里没有 .env,
      # 必须显式给一个(仅用于测试,不签发任何真实 token)
      JWT_SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
      WORKING_DIR: back-end
      # 测试需要的最小配置
      DATABASE_URL: sqlite:///:memory:
      LLM_API_KEY: test-key
      LLM_BASE_URL: https://example.invalid/v4/
      RERANK_API_KEY: test-key
      RERANK_BASE_URL: https://example.invalid/v4/
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: back-end/requirements.txt
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 提示词契约校验(模板缺失/占位符漂移直接失败)
        run: python -c "from services import prompt_library; prompt_library.validate()"
      - name: 运行测试
        run: python -m pytest -v --tb=short

  frontend:
    name: 前端构建 (tsc + vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - name: 安装依赖
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: 类型检查
        run: pnpm tsc --noEmit
      - name: 构建
        run: pnpm vite build
